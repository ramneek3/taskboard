nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

frontend:
  image: ghcr.io/OWNER/REPO/frontend
  tag: replace-with-git-sha
  pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  image: ghcr.io/OWNER/REPO/backend
  tag: replace-with-git-sha
  pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  image: postgres:16-alpine
  existingSecret: taskboard-db
  usernameKey: username
  passwordKey: password
  databaseKey: database
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: taskboard.local
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: kube-prometheus-stack
  grafanaDashboard:
    enabled: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8000"
