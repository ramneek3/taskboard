# Values for the AWS EKS release. CI rewrites the two image tags below on every
# push to main (gitops job), and Argo CD syncs the change into the cluster.
backend:
  tag: bb037c69dfe88cf49ff5a093ba2d94475fa878b0
frontend:
  tag: bb037c69dfe88cf49ff5a093ba2d94475fa878b0

postgres:
  storageClass: gp3

ingress:
  enabled: true
  className: nginx
  # Empty host: the Ingress answers on the ingress-nginx LoadBalancer hostname.
  host: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
