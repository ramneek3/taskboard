name: TaskBoard CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: taskboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Validate Compose
        run: POSTGRES_PASSWORD=ci-placeholder docker compose config >/dev/null

  image-build-scan:
    name: Build images and Trivy gate
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          prefix="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${prefix}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}/frontend" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --build-arg "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${{ steps.names.outputs.backend }}:${{ github.sha }}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${{ steps.names.outputs.frontend }}:${{ github.sha }}" \
            ./frontend

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

  publish:
    name: Publish immutable images to GHCR
    needs: image-build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          prefix="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${prefix}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}/frontend" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images live under the repository package: ghcr.io/<owner>/<repo>/backend
      # and .../frontend. A separate package name cannot be created by GITHUB_TOKEN.
      - name: Push backend image
        run: |
          docker buildx build --push --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ steps.names.outputs.source }}" \
            --label "org.opencontainers.image.source=${{ steps.names.outputs.source }}" \
            -t "${{ steps.names.outputs.backend }}:${{ github.sha }}" \
            ./backend

      - name: Push frontend image
        run: |
          docker buildx build --push --provenance=false \
            --build-arg "IMAGE_SOURCE=${{ steps.names.outputs.source }}" \
            --label "org.opencontainers.image.source=${{ steps.names.outputs.source }}" \
            -t "${{ steps.names.outputs.frontend }}:${{ github.sha }}" \
            ./frontend

  gitops:
    name: Update GitOps image tags for Argo CD
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Argo CD watches helm/taskboard on main. Writing the new commit SHA into
      # values-eks.yaml is the deploy: Argo CD sees the change and syncs the cluster.
      # Pushes made with GITHUB_TOKEN do not start another workflow run.
      - name: Write the new image tag into values-eks.yaml
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1${SHA}/" helm/taskboard/values-eks.yaml
          git diff --stat
          if git diff --quiet; then echo "Tag already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${SHA::7} to EKS through Argo CD [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format, init, validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  helm:
    name: Helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint and render
        run: |
          helm lint helm/taskboard
          helm lint helm/taskboard -f helm/taskboard/values-eks.yaml
          helm template taskboard helm/taskboard --namespace taskboard -f helm/taskboard/values-eks.yaml >/tmp/taskboard-eks.yaml
          helm template taskboard helm/taskboard --namespace taskboard >/tmp/taskboard.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/taskboard.yaml
          grep -q "kind: Ingress" /tmp/taskboard.yaml
          grep -q "kind: PersistentVolumeClaim" /tmp/taskboard.yaml
